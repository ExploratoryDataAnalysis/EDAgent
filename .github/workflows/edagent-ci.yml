name: EDAgent CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EDAgent_Completed_Extension/EDAgent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EDAgent_Completed_Extension/EDAgent/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EDAgent_Completed_Extension/EDAgent/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
